<!doctype html>
<html lang="en">
  {{HEAD}}
  <!-- The page's one icon size. Runtime icons set no `size` of their own and inherit this step
       (portal/shared/icon.js), so changing it here resizes every icon on the page together. -->
  <body data-icon-size="md">
    {{CHROME}}
    {{WIDGET_TEMPLATES}}
    <main class="inner">
      {{LOADING}}
      <section id="warnings" class="notice warn" hidden></section>
      <!-- Shown while auto-discovery is off: no process is observed until the user turns it on. -->
      <div id="auto-discovery-cta" hidden></div>
      <section id="content" class="developer-runtime-content"></section>
    </main>

    <dialog id="link-dialog" aria-labelledby="link-dialog-title">
      <form method="dialog" id="link-form">
        <div class="modal-head">
          <h2 id="link-dialog-title">Edit links</h2>
          <portal-close-button data-close aria-label="Close"></portal-close-button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="link-project" />
          <input type="hidden" id="link-app" />
          <div class="link-list" id="link-list"></div>
          <div class="item-err" id="link-error"></div>
        </div>
        <div class="modal-actions">
          <button type="button" id="link-add">Add row</button>
          <button type="submit" data-btn="cta">Save links</button>
        </div>
      </form>
    </dialog>

    <dialog id="app-dialog" aria-labelledby="app-dialog-title">
      <form method="dialog" id="app-form">
        <div class="modal-head">
          <h2 id="app-dialog-title">App association</h2>
          <portal-close-button data-close aria-label="Close"></portal-close-button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="app-association" />
          <label>
            Project identity
            <input id="app-project" required />
          </label>
          <label>
            Project name
            <input
              id="app-project-name"
              maxlength="80"
              placeholder="Project name"
            />
          </label>
          <label>
            App id
            <input
              id="app-id"
              required
              pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,79}"
              placeholder="web"
            />
          </label>
          <label>
            App name
            <input id="app-name" required maxlength="80" placeholder="Web" />
          </label>
          <label>
            Preferred host
            <select id="app-origin">
              <option value="localhost">localhost</option>
              <option value="127.0.0.1">127.0.0.1</option>
              <option value="::1">::1</option>
            </select>
          </label>
          <div class="toggle-row">
            <label
              ><input id="app-project-favorite" type="checkbox" /> Project
              favorite</label
            >
            <label
              ><input id="app-project-hidden" type="checkbox" /> Hide
              project from Runtime</label
            >
            <label
              ><input id="app-favorite" type="checkbox" /> App favorite</label
            >
            <label><input id="app-hidden" type="checkbox" /> Hide app from Runtime</label>
          </div>
          <label>
            Health path
            <input id="app-health-path" placeholder="/health" />
          </label>
          <label>
            Accepted statuses
            <input id="app-health-statuses" placeholder="200,204" />
          </label>
          <label>
            Match process hints
            <input id="app-match-process" placeholder="node,vite" />
          </label>
          <label>
            Match title hints
            <input id="app-match-title" placeholder="Project title" />
          </label>
          <label>
            Match path hints
            <input id="app-match-path" placeholder="apps/web,packages/api" />
          </label>
          <div class="item-err" id="app-error"></div>
        </div>
        <div class="modal-actions">
          <button type="button" id="app-remove-association">
            Remove association
          </button>
          <button type="submit" data-btn="cta">Save project/app</button>
        </div>
      </form>
    </dialog>

    <dialog id="alias-dialog" aria-labelledby="alias-dialog-title">
      <form method="dialog" id="alias-form">
        <div class="modal-head">
          <h2 id="alias-dialog-title">Confirm alias</h2>
          <portal-close-button data-close aria-label="Close"></portal-close-button>
        </div>
        <div class="modal-body">
          <label>
            Alias from
            <input id="alias-from" required />
          </label>
          <label>
            Alias to
            <input id="alias-to" required />
          </label>
          <label class="check-line"
            ><input id="alias-confirmed" type="checkbox" required /> Confirm
            same project</label
          >
          <div class="item-err" id="alias-error"></div>
        </div>
        <div class="modal-actions">
          <button type="submit" data-btn="cta">Save alias</button>
        </div>
      </form>
    </dialog>

    <dialog id="compose-repo-dialog" aria-labelledby="compose-repo-dialog-title">
      <form method="dialog" id="compose-repo-form">
        <div class="modal-head">
          <h2 id="compose-repo-dialog-title">Associate repo</h2>
          <portal-close-button data-close aria-label="Close"></portal-close-button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="compose-repo-project" />
          <label>
            Compose project
            <input id="compose-repo-project-name" disabled />
          </label>
          <label>
            Repository path
            <input id="compose-repo-path" placeholder="/Users/you/projects/repo" />
          </label>
          <div class="item-err" id="compose-repo-error"></div>
        </div>
        <div class="modal-actions">
          <button type="submit" data-btn="cta">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="settings-dialog" aria-labelledby="settings-dialog-title">
      <div class="modal-head">
        <h2 id="settings-dialog-title">Runtime settings</h2>
        <portal-close-button data-close aria-label="Close"></portal-close-button>
      </div>
      <div class="modal-body settings-body" id="settings-body"></div>
    </dialog>

    <dialog id="history-dialog" aria-labelledby="history-dialog-title">
      <div class="modal-head">
        <h2 id="history-dialog-title">Activity history</h2>
        <portal-close-button data-close aria-label="Close"></portal-close-button>
      </div>
      <div class="modal-body">
        <p class="history-subject" id="history-subject"></p>
        <div class="history-list" id="history-body"></div>
      </div>
    </dialog>

    <!-- API endpoint contract. A real modal rather than an inline expander: the routes list is
         itself a popover, so an endpoint's parameter tables and curl command had no room to open
         in place without the row scrolling out from under them. -->


    <!-- Instance grouping & toolbar -->
    <template id="tpl-group">
      <section class="instance-group">
        <header>
          <h2 data-slot="title"></h2>
          <div class="group-header-end" data-slot="meta"></div>
        </header>
        <div class="instance-grid" data-slot="items"></div>
      </section>
    </template>
    <template id="tpl-toolbar-actions">
      <div class="toolbar-actions">
        <button id="refresh" type="button" class="icon-button" title="Refresh" aria-label="Refresh">
          <portal-icon name="refresh"></portal-icon>
          <span class="spinner" hidden></span>
        </button>
        <button id="settings" type="button">Settings</button>
      </div>
    </template>
    <template id="tpl-collapsible-group">
      <details class="instance-group collapsed-group">
        <summary>
          <span class="collapsed-meta" data-slot="meta"></span>
          <svg class="chevron" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M4 6l4 4 4-4" />
          </svg>
        </summary>
        <div class="expanded-head">
          <h2 data-slot="expanded-title"></h2>
          <button type="button" data-btn="text" data-action="collapse">Hide</button>
        </div>
        <div class="instance-grid" data-slot="items"></div>
      </details>
    </template>
    <!-- Shared git row, cloned into both card kinds by applyGitBadge so a Docker project and a
         plain listener render byte-identical git context. Authored once here rather than copied
         into each card template — the two copies had already drifted (different row placement,
         different sizing) before this was extracted. -->
    <template id="tpl-git-row">
      <span class="git-badge" data-slot="git" hidden>
        <portal-icon name="git-branch" class="git-badge-icon"></portal-icon>
        <!-- Label is set from the provider host (see providerHostLabel), so this placeholder text
             is replaced before the row is shown. It exists so firstChild is a text node. -->
        <!-- No provider glyph here: the git row already leads with the branch icon, and a second
             graph-shaped mark beside it read as noise rather than as identification. The label
             (set from the provider host) plus the external-link icon carry it. -->
        <a class="git-repo-link" data-slot="git-repo-link" target="_blank" rel="noreferrer" hidden
          ><span data-slot="git-repo-label">repo</span
          ><portal-icon name="external-link"></portal-icon
        ></a>
        <span class="git-repo-name" data-slot="git-repo-name" hidden></span>
        <span class="git-sep" aria-hidden="true">·</span>
        <button type="button" class="git-branch-button copy-affordance" data-action="copy-branch" aria-label="Copy branch name">
          <span class="copy-affordance-label" data-slot="git-branch"></span>
          <portal-icon name="copy" class="copy-icon-idle"></portal-icon>
          <portal-icon name="check" class="copy-icon-done"></portal-icon>
        </button>
        <span class="git-sep" aria-hidden="true">·</span>
        <!-- The single most severe thing worth saying about sync state, or nothing at all. Silence
             is the healthy state, so a badge appearing here always means something. Uncommitted
             files and commits ahead are deliberately absent: they are normal mid-task and live in
             the tooltip instead. -->
        <span class="git-drift" data-slot="git-drift" hidden></span>
      </span>
    </template>
    <!-- Instance card + quick links.
         The persistent head is structurally identical to tpl-compose-project-card's: column one is
         a title row plus a git row, column two is the action menu. Only the title row's trailing
         content differs by card kind (a URL here, a container/port/CPU rollup there) — that
         difference is the point of the split, everything else must stay shared. -->
    <template id="tpl-card">
      <article class="instance-card">
        <div class="card-head">
          <div class="card-main">
            <div class="card-title">
              <h3><a data-slot="repository-name"></a></h3>
              <span class="title-separator">-</span>
              <a data-slot="origin" target="_blank" rel="noreferrer"></a>
              <!-- The whale marks a Docker-run instance. Rendered only when the Docker provider
                   actually observed this instance; on a repository member that is usually never,
                   since docker data attaches to compose project instances. -->
              <span class="docker-badge" data-slot="docker" hidden>
                <portal-icon name="docker"></portal-icon>
                <span data-slot="docker-label"></span>
              </span>
              <!-- Other ports held by this same process. Metadata, not links — see
                   applySecondaryPorts. -->
              <span class="secondary-ports" data-slot="secondary-ports" hidden></span>
              <span class="resource-concern-badge" data-slot="resource-concern" hidden></span>
              <!-- The per-row copy dropdown (URL, port, PID) was removed: two of its three entries
                   restated what the row already gives you — the origin is a link you click, the
                   port is the visible half of it. The PID, the one value you cannot get any other
                   way, moved to this card's three-dot menu as its first entry. -->

              <span class="info-wrap" data-tip-html="template">
                <portal-info-icon
                  aria-label="Show instance details"
                ></portal-info-icon>
                <template>
                  <span class="info-tooltip-content">
                    <!-- The page's own <title>. Prose describing the site, kept out of the card
                         heading where it says nothing about which process this is. -->
                    <span data-slot="page-title-detail" hidden
                      ><strong>Page title</strong><span data-slot="page-title-text"></span
                    ></span>
                    <span
                      ><strong>Health</strong><span data-slot="status"></span
                    ></span>
                    <span
                      ><strong>Latency</strong><span data-slot="latency"></span
                    ></span>
                    <span
                      ><strong>Process</strong><span data-slot="process"></span
                    ></span>
                    <span
                      ><strong>Identity</strong><span data-slot="identity"></span
                    ></span>
                    <span><strong>Bind</strong><span data-slot="bind"></span></span>
                    <span data-slot="git-detail" hidden
                      ><strong>Tracking</strong><span data-slot="git-detail-text"></span
                    ></span>
                    <span data-slot="git-commit-detail" hidden
                      ><strong>Commit</strong><span data-slot="git-commit-text"></span
                    ></span>
                    <span data-slot="git-status-detail" hidden
                      ><strong>Working tree</strong><span data-slot="git-status-text"></span
                    ></span>
                    <span data-slot="docker-detail" hidden
                      ><strong>Container</strong><span data-slot="docker-detail-text"></span
                    ></span>
                    <span data-slot="process-metrics-detail" hidden
                      ><strong>Resources</strong><span data-slot="process-metrics-detail-text"></span
                    ></span>
                    <span data-slot="warning" hidden></span>
                  </span>
                </template>
              </span>
            </div>
            <div class="card-git-row" data-slot="git-row"></div>
          </div>
          <!-- Discovered-routes dropdown lives outside the three-dot menu so browsing suggestions
               is its own single click, not a menu-open-then-select detour. Mounted with a
               portal-menu-button (portal/shared/menu-button.js) by app.js, since its content is
               fetched live and can't be pre-authored as static markup — this slot just reserves
               the position. Hidden until wiring confirms the card has an opaque key. -->
          <span data-slot="routes-trigger" hidden></span>
          <!-- Ships hidden; wiring reveals it only once the card is known to have a usable action
               (see revealActionMenuIfUsable). A menu that renders by default and is retracted later
               shows a lying trigger the moment a call site is missed. -->
          <div class="action-menu" hidden>
            <button
              type="button"
              class="menu-trigger"
              data-action="menu"
              aria-label="Actions"
              aria-expanded="false"
            >
              <span></span><span></span><span></span>
            </button>
            <div class="menu-panel" data-menu hidden>
              <!-- Copy URL and Open were removed: the origin link in this same row already opens
                   on click, and the row carries its own copy affordance. Both entries restated
                   default link behavior rather than adding an action.

                   Copy PID leads: it is the one value here you cannot get by clicking the row, and
                   the one you reach for when a process needs killing rather than visiting. It
                   replaces the row's separate copy dropdown, whose other two entries (URL, port)
                   were both obtainable from the row itself.

                   Add link / Edit links moved to the Links panel, where user-added links
                   now sit alongside discovered ones as just another source. -->
              <button type="button" data-action="copy-pid" data-slot="copy-pid" hidden>
                Copy PID
              </button>
              <button type="button" data-action="history">View history</button>
              <button type="button" data-action="associate">
                Change association
              </button>
              <button type="button" data-action="alias">Confirm alias</button>
              <!-- No favorite here: pinning is a repository-level idea (see the repository card's
                   Pin action), and offering it per member asked the user to favorite one port of a
                   thing they were already pinning as a whole. Hide stays — hiding one noisy
                   listener is a real per-member need. -->
              <button type="button" data-action="hide">Hide from Runtime</button>
            </div>
          </div>
        </div>
        <p class="card-notice" data-slot="duplicate-notice" hidden></p>
        <div class="quick-links" data-slot="links" hidden></div>
      </article>
    </template>
    <!-- Compose-project rollup card: one card per docker.composeProject, associated
         ports/containers listed inside as compact rows rather than as separate top-level cards.
         The action-menu trigger lives inside <summary> (the only child <details> keeps visible
         while closed) — its click handler must stopPropagation so opening the menu doesn't also
         toggle the details open/closed. -->
    <!-- Defaults open: the repository card already collapses its members, so a second collapsed
         layer buried the containers behind two clicks. The <details> wrapper stays so the component
         can still be collapsed where it is used standalone. -->
    <template id="tpl-compose-project-card">
      <details class="instance-card compose-project-card" open>
        <summary>
          <div class="card-head">
            <div class="card-main">
              <div class="card-title">
                <!-- A Compose stack is Docker by definition, so the whale is unconditional here.
                     It was previously placed on the member card's docker badge, which never
                     renders: docker data hangs off compose project instances, not repository
                     members, so that badge had no data to show. -->
                <span class="tech-glyph"><portal-icon name="docker"></portal-icon></span>
                <h3 data-slot="title"></h3>
                <span class="title-separator">-</span>
                <span class="compose-project-meta" data-slot="meta"></span>
                <span class="resource-concern-badge" data-slot="resource-concern" hidden></span>
                <span class="info-wrap" data-tip-html="template">
                  <portal-info-icon aria-label="Show project details"></portal-info-icon>
                  <template>
                    <span class="info-tooltip-content">
                      <span><strong>Containers</strong><span data-slot="containers"></span></span>
                      <span><strong>Ports</strong><span data-slot="ports-detail"></span></span>
                      <span><strong>Resources</strong><span data-slot="resources"></span></span>
                      <span><strong>Identity</strong><span data-slot="identity"></span></span>
                      <span data-slot="git-detail" hidden
                        ><strong>Tracking</strong><span data-slot="git-detail-text"></span
                      ></span>
                      <span data-slot="git-commit-detail" hidden
                        ><strong>Commit</strong><span data-slot="git-commit-text"></span
                      ></span>
                      <span data-slot="git-status-detail" hidden
                        ><strong>Working tree</strong><span data-slot="git-status-text"></span
                      ></span>
                    </span>
                  </template>
                </span>
                <!-- No chevron: this card is always open (the <details> carries `open` and its
                     summary is not a toggle), so an expand affordance would advertise an
                     interaction that does nothing. Containers are the point of a Compose card. -->
              </div>
              <div class="card-git-row" data-slot="git-row"></div>
            </div>
            <!-- Hidden until earned — see tpl-card's note. This card is the common empty case: its
                 only two entries are favorite and hide, and both are removed when it is a member of
                 a repository card. -->
            <div class="action-menu" hidden>
              <button
                type="button"
                class="menu-trigger"
                data-action="menu"
                aria-label="Actions"
                aria-expanded="false"
              >
                <span></span><span></span><span></span>
              </button>
              <div class="menu-panel" data-menu hidden>
                <!-- "Associate repo" moved to the repository card's menu: it binds a path to the
                     whole repository, not to this one Compose stack. -->
                <!-- Favorite removed for the same reason as on the instance card: pinning belongs
                     to the repository, not to one Compose stack under it. -->
                <button type="button" data-action="hide">Hide from Runtime</button>
              </div>
            </div>
          </div>
        </summary>
        <div class="compose-project-rows" data-slot="rows"></div>
      </details>
    </template>
    <!-- Repository rollup card: one card per repositoryId, holding every instance that resolves to
         it regardless of how discovery found it. Before this, a repo running a Compose stack, a dev
         server, and a tunnel produced three unrelated cards in three page sections.
         Members render as their existing card kinds nested inside [data-slot=members] — full
         instance cards for listeners, compose sub-cards for stacks — so nothing (quick links,
         association, alias, history) is lost by merging.
         Head mirrors tpl-compose-project-card: title row + git row in column one, action menu in
         column two, and the same "CPU only earns a persistent badge past the concern threshold"
         rule (see applyResourceConcernBadge). -->
    <!-- Defaults collapsed: the canonical entrypoint URL is lifted into the header, so the app is
         reachable in one click without expanding. Members carry the detail you open the card for. -->
    <!-- The card is a plain wrapper, NOT the <details> itself. That split is what lets the members
         drawer sit above a git row that stays visible when collapsed: <details> hides everything
         except its <summary>, so anything that must survive collapse has to live outside it
         entirely. Ordering alone cannot do this — a git row inside <details> disappears no matter
         where it is placed, and one inside <summary> is forced above the drawer. -->
    <template id="tpl-repository-card">
      <!-- No outer <details>/toggle: each worktree row below is its own independent disclosure for
           its member list, so there is nothing left for a repository-level expand/collapse to do —
           name, GitHub link, and every worktree row are always visible. -->
      <article class="instance-card repository-card">
        <div class="card-head card-title-row">
          <div class="card-main">
            <div class="card-title">
              <h3 data-slot="title"></h3>
              <!-- One GitHub/provider link per repository — root-independent (a repository has
                   exactly one canonical remote, however many checkouts run it). -->
              <a class="git-repo-link repository-nested-control" data-slot="provider-link" target="_blank" rel="noreferrer" hidden
                ><span data-slot="provider-link-label">repo</span
                ><portal-icon name="external-link"></portal-icon
              ></a>
              <!-- No URL here: every checkout's app link sits in its own row, main checkout included,
                   so the header names the repository and nothing about where it runs. -->
              <!-- Card-level state, kept out of the right-hand column so
                   that column stays reserved for the aligned per-row controls. "mock" marks a dev
                   fixture; the lifecycle state shows only when the repository is NOT running (an
                   active one says so by listing its members). -->
              <span class="repository-card-badges">
                <span class="repository-state-badge is-mock" data-slot="fixture-badge" hidden>mock</span>
                <span class="repository-state-badge" data-slot="lifecycle-state" hidden></span>
              </span>
              <span class="resource-concern-badge" data-slot="resource-concern" hidden></span>
            </div>
          </div>
          <span class="repository-nested-control" data-slot="repository-menu"></span>
        </div>
        <p class="card-notice" data-slot="duplicate-notice" hidden></p>
        <!-- One row per checkout (main worktree first, then every linked worktree) instead of one
             flat member list — see the plan doc's "Worktree/Root Hierarchy" section. Every row is
             always visible; each has its own independent expand/collapse for its member list. -->
        <div class="repository-roots" data-slot="roots"></div>
      </article>
    </template>
    <!-- One row per container (not per published port) — a single container publishing several
         host ports lists them as nested port rows underneath, instead of repeating the container.
         Process metrics (CPU/RSS/elapsed) are container-level facts — one PID serves every port
         a container publishes — shown once per row rather than repeated on each port. -->
    <!-- Only concern-worthy/actionable facts stay on the persistent row; image, exact RSS, and
         other reference-only details move into the info tooltip (see the follow-up plan doc's
         resource-threshold section for the "what counts as concerning" classification, not yet
         built — this row shows raw values until that lands). -->
    <template id="tpl-compose-container-row">
      <div class="compose-container-row">
        <div class="compose-container-head">
          <!-- Monochrome tech glyph inferred from the container image (see glyphForImage). Hidden
               unless the image is one we recognize — most are not, and a placeholder on every row
               would add noise without distinguishing anything. -->
          <span class="tech-glyph" data-slot="tech-glyph" hidden></span>
          <span class="compose-container-name" data-slot="name"></span>
          <span class="resource-concern-badge" data-slot="resource-concern" hidden></span>
          <span class="info-wrap" data-tip-html="template">
            <portal-info-icon aria-label="Show container details"></portal-info-icon>
            <template>
              <span class="info-tooltip-content">
                <span><strong>Image</strong><span data-slot="image"></span></span>
                <span><strong>State</strong><span data-slot="state"></span></span>
                <span><strong>Resources</strong><span data-slot="resources"></span></span>
              </span>
            </template>
          </span>
        </div>
        <div class="compose-container-ports" data-slot="ports"></div>
      </div>
    </template>
    <!-- Three columns: health badge, then the address with its per-address actions, then history.
         The bare ":PORT" that used to lead the row was dropped — the origin further along the same
         row already carries the port, so it was the same fact twice. -->
    <template id="tpl-compose-container-port">
      <div class="compose-container-port">
        <span class="port-health-badge" data-slot="health-badge"></span>
        <span class="compose-container-port-address">
          <!-- No copy button beside it: a link is already copyable (right-click, or drag), and a
               dedicated control for the same string doubled the row's width for no capability the
               reader did not already have. -->
          <a class="compose-container-port-origin" data-slot="origin" target="_blank" rel="noreferrer"></a>
          <span class="info-wrap" data-tip-html="template">
            <portal-info-icon aria-label="Show port details"></portal-info-icon>
            <template>
              <span class="info-tooltip-content">
                <span><strong>Health</strong><span data-slot="status"></span></span>
                <span><strong>Latency</strong><span data-slot="latency"></span></span>
                <span><strong>Bind</strong><span data-slot="bind"></span></span>
                <span data-slot="warning" hidden></span>
              </span>
            </template>
          </span>
        </span>
        <button type="button" class="compose-container-port-history" data-action="history" title="View history">History</button>
      </div>
    </template>
    <!-- Generic primitives -->
    <template id="tpl-empty">
      <section class="empty-state">
        <h2 data-slot="title"></h2>
        <p data-slot="body"></p>
      </section>
    </template>
    <template id="tpl-notice">
      <p data-slot="text"></p>
    </template>
    <template id="tpl-notice-with-doc">
      <p><span data-slot="text"></span> <a href="/docs/user/reference/runtime.md" target="_blank" rel="noreferrer">Runtime docs</a></p>
    </template>
    <template id="tpl-quick-link">
      <a class="quick-link" target="_blank" rel="noreferrer" data-slot="label"></a>
    </template>
    <template id="tpl-no-links">
      <span class="no-links" data-slot="text"></span>
    </template>
    <template id="tpl-history-row">
      <div class="history-row">
        <span class="history-when" data-slot="when"></span>
        <span class="history-type" data-slot="type"></span>
        <span class="history-detail" data-slot="detail"></span>
      </div>
    </template>
    <!-- One discovered route in the routes-trigger dropdown (portal-menu-button's panel, wired in
         app.js). A plain link, not a form control: clicking it opens the route AND — the first time
         only, see wireRouteLink in app.js — captures it into the app's saved quick links. The
         checkmark is a static indicator, not a toggle; there is no "remove" affordance here, that
         still lives in "Edit links" for the same reason a browser bookmarks bar isn't managed from
         its own autocomplete dropdown. -->
    <!-- The trailing slot holds either the saved checkmark (a discovered route that has been
         captured) or the edit/delete pair (a user-added one). They are mutually exclusive and share
         the row's end position: a user link is saved by definition, so a checkmark there would state
         something that is never in question, where the actions are what that row actually needs. -->
    <!-- Settings dialog: link editor rows + settings sections -->
    <template id="tpl-link-empty">
      <p class="no-links" data-empty="true">No saved links. Add a row to create one.</p>
    </template>
    <template id="tpl-link-row">
      <div class="link-row">
        <input type="hidden" data-field="id" />
        <label>
          Label
          <input data-field="label" required maxlength="80" />
        </label>
        <label>
          Path or loopback URL
          <input data-field="path" required placeholder="/admin" />
        </label>
        <div class="link-row-actions">
          <button type="button" data-action="up" aria-label="Move link up">
            Up
          </button>
          <button type="button" data-action="down" aria-label="Move link down">
            Down
          </button>
          <button type="button" data-action="remove" aria-label="Remove link">
            Remove
          </button>
        </div>
      </div>
    </template>
    <template id="tpl-settings-section">
      <section class="settings-section">
        <h3 data-slot="title"></h3>
        <div data-slot="rows"></div>
      </section>
    </template>
    <template id="tpl-settings-row">
      <div class="settings-row">
        <div>
          <strong data-slot="title"></strong>
          <span data-slot="meta"></span>
        </div>
        <button type="button" data-slot="action"></button>
      </div>
    </template>
    {{REPOSITORY_SOURCES}}
    <script type="module" src="/portal/shared/info-icon.js"></script>
    <script type="module" src="/portal/shared/icon.js"></script>
    <script type="module" src="/portal/shared/close-button.js"></script>
    <script type="module" src="/portal/shared/theme.js"></script>
    <script type="module" src="/portal/shared/tooltip.js"></script>
    <script type="module" src="/portal/developer-runtime/app.js"></script>
  </body>
</html>
