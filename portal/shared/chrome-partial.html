<template id="tpl-portal-header">
  <header class="portal-header">
    <div class="inner">
      <div class="logo-wrapper">
        <h1 class="portal-logo"><a href="/" aria-label="roborepo home" title="roborepo"><portal-icon name="robot" size="xl"></portal-icon></a></h1>
        <span id="portal-updated" class="portal-updated" role="status" data-state="pending" title="Connecting"><span class="portal-updated-dot" aria-hidden="true"></span><span class="portal-updated-label" data-slot="label"></span></span>
      </div>
      <nav id="nav" aria-label="Portal sections"></nav>
    </div>
  </header>
</template>
<template id="tpl-portal-footer">
  <footer class="portal-footer">
    <div class="inner">
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle theme"
      ></button>
    </div>
  </footer>
</template>
<template id="tpl-nav-link">
  <a><span class="nav-label" data-slot="label"></span></a>
</template>
<!-- The ⋮ menu at the end of the header nav. Its panel lists every page; CSS shows only the
     secondary ones while the primary pages fit in the bar, and all of them once they don't. -->
<template id="tpl-nav-more">
  <div class="nav-more">
    <button
      type="button"
      class="nav-more-trigger"
      aria-label="More pages"
      title="More"
      aria-expanded="false"
      aria-controls="nav-more-panel"
    ><span></span><span></span><span></span></button>
    <div id="nav-more-panel" class="nav-more-panel" hidden></div>
  </div>
</template>
