<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>roborepo :: {{TITLE}}</title>
  <!-- PNG first, SVG last with sizes="any": Chrome otherwise prefers the sized PNG over the SVG. -->
  <link rel="icon" href="/portal/shared/favicon/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/portal/shared/favicon/favicon.svg" type="image/svg+xml" sizes="any" />
  <link rel="apple-touch-icon" href="/portal/shared/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/portal/shared/favicon/site.webmanifest" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("portal-theme");
        document.documentElement.dataset.theme =
          t === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="/portal/shared/base.css" />
  <link rel="stylesheet" href="/portal/shared/skill-source-view.css" />
  <link rel="stylesheet" href="/portal/shared/markdown.css" />
  <link rel="stylesheet" href="{{STYLE_HREF}}" />
</head>
