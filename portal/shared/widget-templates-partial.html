<!-- Templates for shared/*.js custom elements (option-dropdown, token-chip, menu-button,
     copy-button, close-button, notice). Injected into every page via {{WIDGET_TEMPLATES}} —
     same pattern as chrome-partial.html — so each element's render() clones real <template>
     markup instead of hand-assembling nested DOM with chained createElement calls. -->

<!-- option-dropdown.js -->
<template id="tpl-dropdown-trigger">
  <button type="button" class="dropdown-trigger" aria-haspopup="listbox"></button>
</template>
<template id="tpl-dropdown-spinner">
  <span class="spinner"></span>
</template>
<template id="tpl-dropdown-chevron">
  <span class="dropdown-chevron" aria-hidden="true">▾</span>
</template>
<template id="tpl-dropdown-menu">
  <div class="dropdown-menu" role="listbox"></div>
</template>
<template id="tpl-dropdown-option">
  <button type="button" class="dropdown-option" role="option" data-slot="label"></button>
</template>

<!-- token-chip.js -->
<template id="tpl-token-chip">
  <span class="token-chip" data-slot="text"></span>
</template>
<template id="tpl-chip-info-icon">
  <span class="chip-info" aria-hidden="true">ⓘ</span>
</template>
<template id="tpl-chip-tip">
  <span class="chip-tip" hidden></span>
</template>
<template id="tpl-chip-tip-head">
  <span class="chip-tip-head" data-slot="text"></span>
</template>
<template id="tpl-chip-tip-note">
  <span class="chip-tip-note" data-slot="text"></span>
</template>
<template id="tpl-chip-tip-table">
  <span class="chip-tip-table"></span>
</template>
<template id="tpl-chip-tip-cell">
  <span class="chip-tip-cell" data-slot="text"></span>
</template>
<template id="tpl-chip-tip-legend">
  <span class="chip-tip-legend"></span>
</template>
<template id="tpl-chip-tip-legend-line">
  <span class="chip-tip-legend-line">
    <span class="chip-tip-dot" data-slot="dot"></span
    ><span data-slot="text"></span>
  </span>
</template>
<template id="tpl-chip-tip-foot">
  <span class="chip-tip-foot">Estimated: ~4 characters ≈ 1 token</span>
</template>

<!-- menu-button.js -->
<template id="tpl-menu-button-trigger">
  <button type="button" class="menu-button-trigger" aria-haspopup="true"></button>
</template>
<template id="tpl-menu-button-panel">
  <div class="menu-button-panel"></div>
</template>

<!-- copy-menu.js — icon-only copy trigger + caret, opening a list of copy actions. The trigger
     carries no text label: the copy glyph names the action, and the items inside say what each
     one copies, so a "Copy" word on the trigger only repeated the first word of every item. -->
<template id="tpl-copy-menu-trigger">
  <button type="button" class="copy-menu-trigger" aria-haspopup="true" aria-label="Copy">
    <portal-icon data-slot="icon" name="copy" size="md"></portal-icon
    ><portal-icon name="chevron" size="sm" class="copy-menu-chevron"></portal-icon>
    <!-- Copied confirmation is an IN-PLACE face swap (copy glyph → check, same box), matching
         portal-copy-button — no overlay element, no alignment drift. copy-menu.js owns the swap;
         .copy-menu-trigger.copied in base.css owns the color. -->
  </button>
</template>
<template id="tpl-copy-menu-panel">
  <div class="copy-menu-panel"></div>
</template>
<template id="tpl-copy-menu-item">
  <button type="button" class="copy-menu-item"><span data-slot="label"></span></button>
</template>

<!-- copy-button.js -->
<template id="tpl-copy-button">
  <button type="button" class="copy-button">
    <span class="copy-button-state" data-slot="idle">
      <portal-icon data-slot="icon" size="sm"></portal-icon
      ><span data-slot="label"></span>
    </span>
    <!-- Copied state is an IN-PLACE face swap (icon → check, label → "Copied") inside this same
         button box — no overlay element, so the wrapper never moves and alignment can't drift.
         copy-button.js owns the swap; .copy-button-copied in base.css owns the color. -->
  </button>
</template>

<!-- close-button.js -->
<template id="tpl-close-button">
  <button type="button" class="close-button">
    <portal-icon name="close" size="sm"></portal-icon>
  </button>
</template>

<!-- notice.js -->
<template id="tpl-notice-icon">
  <span data-notice-icon="" aria-hidden="true">
    <portal-icon data-slot="icon" size="xl"></portal-icon>
  </span>
</template>

<!-- harness-warning.js — the shared "install a supported harness" banner, rendered by
     harnessWarningElement() on any page (Agents + Tokens). One template so the two pages can
     never drift. -->
<!-- harness-warning.js harnessSetupPromptElement() — Home's info-toned version of the same
     condition: a prompt to set things up rather than a warning that something is missing. -->
<template id="tpl-harness-setup-prompt">
  <portal-notice variant="info" icon="info" aria-live="polite">
    <div class="harness-setup-prompt">
      <span>Install a supported harness, then check for installs to add <a href="/config">agent tools</a> and enable <a href="/tokens">token tracking</a>.</span>
      <button type="button" data-btn="secondary" data-slot="check">Check for installs</button>
      <span class="harness-setup-supported" data-slot="supported"><b>Supported Harnesses:</b> <span data-slot="names"></span></span>
    </div>
  </portal-notice>
</template>
<template id="tpl-harness-warning">
  <portal-notice aria-live="polite">
    <div class="config-empty">
      <strong data-slot="title"></strong>
      <span data-slot="body"></span>
      <button type="button" data-btn="secondary" data-slot="check">Check for installs</button>
    </div>
  </portal-notice>
</template>

    <dialog id="api-route-dialog" aria-labelledby="api-route-dialog-title">
      <div class="modal-head">
        <h2 id="api-route-dialog-title">
          <span class="route-api-method" data-slot="method"></span>
          <span class="route-api-path" data-slot="path"></span>
        </h2>
        <portal-close-button data-close aria-label="Close"></portal-close-button>
      </div>
      <div class="modal-body">
        <p class="route-api-description" data-slot="summary" hidden></p>
        <div data-slot="params"></div>
        <div class="route-api-curl">
          <div class="route-api-curl-head">
            <span class="route-api-curl-label">curl</span>
            <portal-copy-button data-slot="curl-copy" label="Copy"></portal-copy-button>
          </div>
          <pre class="route-api-curl-text" data-slot="curl-text"></pre>
          <p class="route-api-curl-hint" data-slot="curl-hint" hidden></p>
        </div>
      </div>
    </dialog>
    <template id="tpl-route-link-row">
      <a class="route-link-row" data-slot="href" target="_blank" rel="noreferrer">
        <span class="history-type" data-slot="source"></span>
        <span class="history-detail" data-slot="path"></span>
        <portal-icon name="check" data-slot="saved-check" hidden></portal-icon>
        <span class="route-link-actions" data-slot="row-actions" hidden>
          <button type="button" class="route-row-action" data-action="edit-link" aria-label="Edit link">
            <portal-icon name="pencil"></portal-icon>
          </button>
          <!-- `close` rather than a trash glyph: the icon set has no trash, and close already reads
               as "remove this" everywhere else in the portal. Adding a one-use glyph for parity with
               a convention this UI does not otherwise follow is not worth the surface. -->
          <button type="button" class="route-row-action" data-action="delete-link" aria-label="Delete link">
            <portal-icon name="close"></portal-icon>
          </button>
        </span>
      </a>
    </template>
    <!-- Section heading with an optional right-aligned action. Used by the Pages heading to carry
         "+ Add", which is a plain button rather than a CTA: adding a link is one option among the
         rows below it, not the panel's primary purpose. -->
    <template id="tpl-routes-section-heading">
      <div class="routes-section-heading">
        <span data-slot="title"></span>
        <button type="button" class="routes-heading-action" data-slot="action" hidden>
          + Add
        </button>
      </div>
    </template>
    <!-- An API route is described, not opened. Most need a method, a body, or auth, so a plain link
         would 404/405 or dump JSON. The row is a button that opens the contract modal
         (#api-route-dialog) instead of an anchor that navigates. -->
    <template id="tpl-route-api-row">
      <button type="button" class="route-api-row">
        <span class="route-api-method" data-slot="method"></span>
        <span class="route-api-path" data-slot="path"></span>
        <!-- A saved API route renders here only, never as a duplicate row under Pages, so this is
             where its saved state has to appear. -->
        <portal-icon name="check" data-slot="saved-check" hidden></portal-icon>
      </button>
    </template>
    <template id="tpl-route-param-table">
      <div class="route-param-table">
        <div class="route-param-title" data-slot="title"></div>
        <div class="route-param-rows" data-slot="rows"></div>
      </div>
    </template>
    <template id="tpl-route-param-row">
      <div class="route-param-row">
        <span class="route-param-name" data-slot="name"></span>
        <span class="route-param-type" data-slot="type"></span>
        <span class="route-param-required" data-slot="required"></span>
        <span class="route-param-example" data-slot="example"></span>
      </div>
    </template>
