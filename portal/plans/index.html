<!doctype html>
<html lang="en">
  {{HEAD}}
  <body>
    {{CHROME}}
    {{WIDGET_TEMPLATES}}
    <section id="package-banner" class="package-banner" hidden></section>
    <!-- One sticky row under the site header: the lifecycle title with Refresh beside it, the lifecycle
         tabs, then Filters at the far right. On narrow screens the title goes, the tabs collapse into a
         menu on the left, and Refresh moves to the right of Filters. -->
    <div id="plans-header" hidden>
      <div class="inner">
        <div class="lifecycle-bar" id="lifecycle-bar">
          <h2 class="lifecycle-title" id="lifecycle-title"></h2>
          <button type="button" class="icon-action" id="refresh" aria-label="Refresh" title="Refresh">
            <portal-icon size="sm" name="refresh"></portal-icon>
            <span class="spinner" hidden></span>
          </button>
          <nav class="lifecycle-tabs" id="lifecycle-tabs" aria-label="Plan lifecycle"></nav>
          <button type="button" class="icon-action" id="filters-toggle" aria-label="Filters" title="Filters">
            <portal-icon name="sliders" size="md"></portal-icon>
          </button>
        </div>
      </div>
    </div>
    <!-- Filters: edits are drafted here and only applied by Update, which stays disabled until a
         value differs from the filters currently applied. Cancel (or closing) throws the draft away. -->
    <dialog id="filters-dialog" data-dialog-size="md" aria-labelledby="filters-dialog-title">
      <div class="modal-head">
        <h2 class="modal-title" id="filters-dialog-title">Filters</h2>
        <portal-close-button id="filters-close" aria-label="Close"></portal-close-button>
      </div>
      <div class="modal-body filters-dialog-body">
        <div class="filter-row filter-row-search">
          <label for="search">Search</label>
          <div class="search-field">
            <input id="search" type="search" placeholder="search plans" />
          </div>
        </div>
        <div class="filter-row">
          <label for="blocked">Blocked</label>
          <select id="blocked"></select>
        </div>
        <div class="filter-row">
          <label for="structure">Structure</label>
          <select id="structure"></select>
        </div>
        <div class="filter-row">
          <label for="freshness">Plan freshness</label>
          <select id="freshness"></select>
        </div>
        <div class="filter-row">
          <label for="health">Health</label>
          <select id="health"></select>
        </div>
      </div>
      <div class="filters-dialog-actions">
        <button id="filters-cancel" type="button" data-btn="secondary">Cancel</button>
        <button id="filters-update" type="button" data-btn="cta" disabled>Update</button>
      </div>
    </dialog>
    <!-- Backlog Ordering: every way out of a dirty draft asks here first. -->
    <dialog id="ordering-guard" data-dialog-size="sm" aria-labelledby="ordering-guard-message">
      <div class="modal-body">
        <p id="ordering-guard-message" data-slot="message"></p>
        <p class="backlog-dialog-error" data-slot="error" role="alert"></p>
      </div>
      <div class="filters-dialog-actions">
        <button type="button" data-btn="secondary" data-slot="cancel">Cancel</button>
        <button type="button" data-btn="cta" data-slot="save">Save and continue</button>
      </div>
    </dialog>
    <dialog id="ordering-discard" data-dialog-size="sm" aria-labelledby="ordering-discard-message">
      <div class="modal-body">
        <p id="ordering-discard-message">Discard your unsaved order?</p>
      </div>
      <div class="filters-dialog-actions">
        <button type="button" data-btn="secondary" data-slot="keep">Keep editing</button>
        <button type="button" data-btn="cta" data-slot="discard">Discard changes</button>
      </div>
    </dialog>
    <div id="blockers-popover" class="blockers-popover" hidden role="menu">
      <p class="blockers-popover-title" data-slot="title"></p>
      <div class="blockers-popover-list" data-slot="list"></div>
    </div>
    <main class="inner">
      {{LOADING}}
      <!-- Shown when Plans has nothing to list yet: the shared repository empty state, or the
           scanning and no-plans steps (app.js chooses; one call to action at a time). -->
      <div id="plans-onboarding" hidden></div>
      <!-- The filters in effect, as removable tags; empty (and so hidden) when none are. -->
      <div class="filter-chips" id="filter-chips"></div>
      <section id="warnings" class="warnings" hidden></section>
      <section id="groups" class="groups"></section>
    </main>
    <!-- The enable-skill onboarding banner (tpl-package-banner) lives in plan-drawer-partial.html,
         since the drawer's menu uses it too. -->
    <!-- Generic primitives: reused across panels, no single owner -->
    <template id="tpl-empty-state">
      <section class="empty-state">
        <div class="empty-state-copy">
          <h2 data-slot="title"></h2>
          <p data-slot="body"></p>
        </div>
        <a href="#manage-repositories" data-btn="secondary" data-slot="action" hidden></a>
      </section>
    </template>
    <template id="tpl-plans-no-repositories">
      <portal-notice class="portal-notice plans-no-repositories" variant="info" icon="info">
        <div class="portal-banner-content plans-no-repositories-content">
          <div class="portal-banner-copy"><p><strong>Add a repo</strong><span class="portal-banner-supporting"> to discover associated feature plans.</span></p></div>
          <div class="portal-banner-action"><button type="button" data-btn="cta" data-slot="manage">Manage Repos</button></div>
        </div>
      </portal-notice>
    </template>
    <template id="tpl-warning-line">
      <div data-slot="text"></div>
    </template>
    <template id="tpl-spinner">
      <span class="spinner"></span>
    </template>

    <!-- Filters & lifecycle tabs -->
    <template id="tpl-lifecycle-tab">
      <button
        type="button"
        class="lifecycle-tab"
        data-slot="label"
      ></button>
    </template>

    <!-- Card actions. The ⋯ menu templates both cards and the drawer use are in
         plan-drawer-partial.html. -->
    <template id="tpl-recommended-cta">
      <button
        type="button"
        class="recommended-cta"
        data-btn="cta"
      ><portal-icon name="copy" size="sm" aria-hidden="true"></portal-icon><span data-slot="label"></span></button>
    </template>
    <!-- Active-filter chips (control bar) -->
    <template id="tpl-filter-chip">
      <span class="filter-chip">
        <span class="filter-chip-label" data-slot="label"></span>
        <span class="filter-chip-value" data-slot="value"></span>
        <button
          type="button"
          class="filter-chip-remove"
          data-slot="remove"
          title="Remove filter"
        >
          ×
        </button>
      </span>
    </template>

    <!-- Plan card & drawer -->
    <template id="tpl-plan-card">
      <article class="plan-card">
        <div class="doc-details">
          <h3 class="card-header-row">
            <a class="repo-badge" data-slot="repo-badge"></a>
            <span class="title-link" data-slot="title-link"></span>
          </h3>
          <p class="description-line" data-slot="description"></p>
        </div>
        <div data-slot="status-mount"></div>
      </article>
    </template>
    <!-- Backlog: directory levels, then one namespace list as Details or Ordering. -->
    <template id="tpl-backlog-breadcrumb"><nav class="backlog-breadcrumb" aria-label="Backlog location"></nav></template>
    <template id="tpl-backlog-breadcrumb-separator"><span class="backlog-breadcrumb-separator" aria-hidden="true">/</span></template>
    <template id="tpl-backlog-breadcrumb-link"><a data-slot="label"></a></template>
    <template id="tpl-backlog-breadcrumb-current"><span aria-current="page" data-slot="label"></span></template>
    <template id="tpl-backlog-directory"><div class="backlog-directory" role="group" aria-label="Backlog directory"></div></template>
    <template id="tpl-backlog-directory-row">
      <a class="backlog-directory-row">
        <portal-icon data-slot="icon" size="sm" aria-hidden="true"></portal-icon>
        <span class="backlog-directory-label" data-slot="label"></span>
        <span class="backlog-directory-count" data-slot="count"></span>
        <span class="backlog-directory-status" data-slot="unprioritized"></span>
        <portal-icon class="backlog-directory-chevron" name="chevron" size="sm" aria-hidden="true"></portal-icon>
      </a>
    </template>
    <template id="tpl-backlog-next-up"><div class="backlog-directory" role="group" aria-label="Next up"></div></template>
    <template id="tpl-backlog-next-up-row">
      <div class="backlog-next-up-row">
        <button type="button" class="backlog-plan-title" data-slot="title"></button>
        <span class="backlog-plan-clue" data-slot="status"></span>
      </div>
    </template>
    <template id="tpl-backlog-no-config">
      <portal-notice class="portal-notice" variant="info" icon="info">
        <p>This repo has no plan namespaces yet. Run <code>/plan-suite-init</code> to declare them.</p>
      </portal-notice>
    </template>
    <template id="tpl-backlog-finding">
      <portal-notice class="portal-notice" variant="warning" icon="warning">
        <p><strong data-slot="message"></strong> <span data-slot="resolution"></span></p>
      </portal-notice>
    </template>
    <template id="tpl-backlog-move-notice">
      <portal-notice class="portal-notice" variant="info" icon="info">
        <p data-slot="text"></p>
      </portal-notice>
    </template>
    <template id="tpl-backlog-repair">
      <div class="backlog-repair-row">
        <button type="button" class="backlog-plan-title" data-slot="title"></button>
        <code data-slot="filename"></code>
        <ul class="backlog-repair-findings" data-slot="findings" hidden></ul>
        <button type="button" data-btn="secondary" data-slot="repair" hidden>Copy Repair Prompt</button>
      </div>
    </template>
    <template id="tpl-backlog-finding-line"><li><span data-slot="message"></span> <span class="backlog-repair-resolution" data-slot="resolution"></span></li></template>
    <template id="tpl-backlog-namespace-header">
      <div class="backlog-namespace-header">
        <span data-slot="breadcrumb"></span>
        <div class="backlog-mode-toggle" role="group" aria-label="Backlog view">
          <button type="button" data-mode="details">Details</button>
          <button type="button" data-mode="ordering">Ordering</button>
        </div>
      </div>
    </template>
    <template id="tpl-backlog-section">
      <section class="backlog-section"><h3 class="backlog-section-title" data-slot="title"></h3></section>
    </template>
    <template id="tpl-backlog-row">
      <div class="backlog-block-body">
        <span class="backlog-position" data-slot="position"></span>
        <div class="backlog-block-plans"><span data-slot="plans"></span></div>
        <span data-slot="controls"></span>
      </div>
    </template>
    <template id="tpl-backlog-group">
      <div class="backlog-block-body backlog-block-group">
        <div class="backlog-group-head">
          <span class="backlog-position" data-slot="position"></span>
          <portal-icon name="link" size="sm" aria-hidden="true"></portal-icon>
          <span class="backlog-group-count" data-slot="count"></span>
          <span data-slot="controls"></span>
        </div>
        <div class="backlog-block-plans"><span data-slot="plans"></span></div>
      </div>
    </template>
    <template id="tpl-backlog-plan">
      <div class="backlog-plan">
        <button type="button" class="backlog-plan-title" data-slot="title"></button>
        <span class="backlog-plan-purpose" data-slot="purpose"></span>
        <span class="backlog-plan-clue" data-slot="clue"></span>
      </div>
    </template>
    <template id="tpl-backlog-controls"><div class="backlog-controls" role="group" aria-label="Move"></div></template>
    <template id="tpl-backlog-control">
      <button type="button" class="icon-action"><portal-icon size="sm" aria-hidden="true"></portal-icon></button>
    </template>
    <template id="tpl-backlog-handle">
      <span class="backlog-drag-handle" draggable="true" role="img" aria-label="Drag to move" title="Drag to move"><portal-icon name="grip" size="sm" aria-hidden="true"></portal-icon></span>
    </template>
    <template id="tpl-backlog-blocked"><span class="state-badge warn">blocked</span></template>
    <template id="tpl-backlog-drop-empty"><p class="backlog-drop-empty">Drop plans here</p></template>
    <template id="tpl-backlog-action-bar">
      <div class="backlog-action-bar" role="group" aria-label="Unsaved order">
        <span class="backlog-action-status" data-slot="status" role="status"></span>
        <button type="button" data-btn="secondary" data-slot="cancel">Cancel</button>
        <button type="button" data-btn="cta" data-slot="save">Save</button>
      </div>
    </template>
    {{PLAN_DRAWER}}
    {{REPOSITORY_SOURCES}}

    <script src="/portal/shared/icon.js" type="module"></script>
    <script src="/portal/shared/notice.js" type="module"></script>
    <script src="/portal/shared/close-button.js" type="module"></script>
    <script src="/portal/shared/copy-button.js" type="module"></script>
    <script src="/portal/shared/menu-button.js" type="module"></script>
    <script src="/portal/plans/elements/index.js" type="module"></script>
    <script src="/portal/shared/theme.js" type="module"></script>
    <script src="/portal/plans/app.js" type="module"></script>
  </body>
</html>
