<!doctype html>
<html lang="en">
  {{HEAD}}
  <body>
    {{CHROME}}
    {{WIDGET_TEMPLATES}}
    <section id="package-banner" class="package-banner" hidden></section>
    <div id="plans-header" hidden>
      <section class="control-panel control-bar" id="control-bar">
        <div class="inner">
          <div class="control-panel-row control-bar-row">
            <span class="repo-count">
              Monitoring
              <span id="plans-count-text"><strong>0</strong> Plans</span>
              in
              <a
                class="repos-count-button"
                id="repos-count-text"
                href="#manage-repositories"
                title="Manage Repos"
              ><strong>0</strong> Repos</a>
              <span class="control-toggle-group">
                <button
                  type="button"
                  data-btn="secondary"
                  class="control-item-action"
                  id="refresh"
                  aria-label="Refresh"
                  title="Refresh"
                >
                  <portal-icon size="lg"
                    name="refresh"
                  ></portal-icon>
                  <span class="spinner" hidden></span>
                </button>
              </span>
            </span>
            <div class="control-toggle-group">
              <button
                type="button"
                data-btn="secondary"
                class="control-item-action"
                id="filters-toggle"
              >
                <portal-icon name="filter" size="lg"></portal-icon>
                Filters
              </button>
            </div>
          </div>
          <div class="filter-chips" id="filter-chips"></div>
          <div class="filters-body" id="filters-body" hidden>
            <div class="filter-row-grid">
              <div class="filter-row filter-row-search">
                <label for="search">Search</label>
                <div class="search-field">
                  <input id="search" type="search" placeholder="search plans" />
                </div>
              </div>
              <div class="filter-row">
                <label for="repository">Repository</label>
                <select id="repository"></select>
              </div>
              <div class="filter-row">
                <label for="priority">Priority</label>
                <select id="priority"></select>
              </div>
              <div class="filter-row">
                <label for="blocked">Blocked</label>
                <select id="blocked"></select>
              </div>
              <div class="filter-row">
                <label for="readiness">Readiness</label>
                <select id="readiness"></select>
              </div>
              <div class="filter-row">
                <label for="review">Review</label>
                <select id="review"></select>
              </div>
              <div class="filter-row">
                <label for="health">Health</label>
                <select id="health"></select>
              </div>
            </div>
            <div class="filter-row filter-row-actions">
              <button id="filters-done" type="button">Done</button>
            </div>
          </div>
        </div>
      </section>
      <div class="inner">
        <nav class="lifecycle-tabs" id="lifecycle-tabs" role="tablist"></nav>
        <div
          class="lifecycle-dropdown-mount"
          id="lifecycle-dropdown-mount"
        ></div>
      </div>
    </div>
    <div id="blockers-popover" class="blockers-popover" hidden role="menu">
      <p class="blockers-popover-title" data-slot="title"></p>
      <div class="blockers-popover-list" data-slot="list"></div>
    </div>
    <main class="inner">
      {{LOADING}}
      <!-- Shown when Plans has nothing to list yet: the shared repository empty state, or the
           scanning and no-plans steps (app.js chooses; one call to action at a time). -->
      <div id="plans-onboarding" hidden></div>
      <section id="warnings" class="warnings" hidden></section>
      <!-- Active-tab only; app.js toggles `hidden` with the selected lifecycle. -->
      <div id="active-tasks-bar" class="active-tasks-bar" hidden>
        <button type="button" id="open-all-tasks">View All Open Tasks</button>
      </div>
      <section id="groups" class="groups"></section>
    </main>
    <dialog
      id="all-tasks-modal"
      data-dialog-size="xl"
      aria-labelledby="all-tasks-modal-title"
    >
      <div class="modal-head">
        <span class="modal-title" id="all-tasks-modal-title"
          >All Open Tasks</span
        >
        <span class="modal-path" id="all-tasks-summary"></span>
        <portal-close-button
          id="all-tasks-close"
          aria-label="Close"
        ></portal-close-button>
      </div>
      <div class="modal-body">
        <div id="all-tasks-body" class="all-tasks-body"></div>
      </div>
    </dialog>
    <dialog id="lifecycle-error-modal" aria-labelledby="lifecycle-error-modal-title">
      <div class="modal-head">
        <span class="modal-title lifecycle-error-title" id="lifecycle-error-modal-title">
          <portal-icon name="warning" size="lg"></portal-icon>
          <span data-slot="title"></span>
        </span>
        <portal-close-button
          data-slot="close"
          aria-label="Close"
        ></portal-close-button>
      </div>
      <div class="modal-body">
        <p class="modal-note" data-slot="resolution"></p>
        <p class="lifecycle-findings-label" data-slot="blocking-label" hidden>Must fix before moving</p>
        <ul class="lifecycle-error-details" data-slot="details"></ul>
        <p class="lifecycle-findings-label" data-slot="advisory-label" hidden>Also worth fixing</p>
        <ul class="lifecycle-error-details" data-slot="advisory-details" hidden></ul>
        <div class="modalactions">
          <portal-copy-button
            data-slot="copy-prompt"
            label="Copy prompt to resolve warnings"
            hidden
          ></portal-copy-button>
          <button type="button" data-slot="view-plan">View Plan</button>
          <button type="button" data-btn="cta" data-slot="confirm-action" hidden>Move anyway</button>
          <button type="button" data-slot="close-action">Cancel</button>
        </div>
      </div>
    </dialog>
    <!-- The enable-skill onboarding banner (tpl-package-banner) lives in plan-drawer-partial.html,
         since the drawer's menu uses it too. -->
    <!-- Generic primitives: reused across panels, no single owner -->
    <template id="tpl-empty-state">
      <section class="empty-state">
        <div class="empty-state-copy">
          <h2 data-slot="title"></h2>
          <p data-slot="body"></p>
        </div>
        <a href="#manage-repositories" data-btn="secondary" data-slot="action" hidden></a>
      </section>
    </template>
    <template id="tpl-plans-no-repositories">
      <portal-notice class="portal-notice plans-no-repositories" variant="info" icon="info">
        <div class="portal-banner-content plans-no-repositories-content">
          <div class="portal-banner-copy"><p><strong>Add a repo</strong><span class="portal-banner-supporting"> to discover associated feature plans.</span></p></div>
          <div class="portal-banner-action"><button type="button" data-btn="cta" data-slot="manage">Manage Repos</button></div>
        </div>
      </portal-notice>
    </template>
    <template id="tpl-warning-line">
      <div data-slot="text"></div>
    </template>
    <template id="tpl-spinner">
      <span class="spinner"></span>
    </template>

    <!-- Filters & lifecycle tabs -->
    <template id="tpl-lifecycle-tab">
      <button
        type="button"
        class="lifecycle-tab"
        role="tab"
        data-slot="label"
      ></button>
    </template>

    <!-- Card actions. The ⋯ menu templates both cards and the drawer use are in
         plan-drawer-partial.html. -->
    <template id="tpl-recommended-cta">
      <button
        type="button"
        class="recommended-cta"
        data-btn="cta"
        data-slot="label"
      ></button>
    </template>
    <!-- Lifecycle readiness findings (blocked-move dialog) -->
    <template id="tpl-lifecycle-finding">
      <li class="lifecycle-finding">
        <p class="lifecycle-finding-message" data-slot="message"></p>
        <p class="lifecycle-finding-resolution" data-slot="resolution"></p>
      </li>
    </template>

    <!-- Active-filter chips (control bar) -->
    <template id="tpl-filter-chip">
      <span class="filter-chip">
        <span class="filter-chip-label" data-slot="label"></span>
        <span class="filter-chip-value" data-slot="value"></span>
        <button
          type="button"
          class="filter-chip-remove"
          data-slot="remove"
          title="Remove filter"
        >
          ×
        </button>
      </span>
    </template>

    <!-- Plan card & drawer -->
    <template id="tpl-all-tasks-project">
      <section class="all-tasks-project">
        <header class="all-tasks-project-head">
          <span class="all-tasks-percent" data-slot="percent"></span>
          <span class="all-tasks-project-title" data-slot="title"></span>
          <span class="all-tasks-repo" data-slot="repo"></span>
          <span class="all-tasks-count" data-slot="count"></span>
        </header>
        <p class="all-tasks-notstarted" data-slot="notstarted" hidden>
          <span>Project Not Started</span>
          <button type="button" data-btn="text" data-slot="view-story">
            View Story
          </button>
        </p>
        <ul class="all-tasks-list" data-slot="tasks"></ul>
      </section>
    </template>
    <template id="tpl-all-tasks-item">
      <li class="all-tasks-item"><span data-slot="text"></span></li>
    </template>
    <template id="tpl-plan-card">
      <article class="plan-card">
        <div class="doc-details">
          <h3 class="card-header-row">
            <span class="title-link" data-slot="title-link"></span>
          </h3>
          <p class="description-line" data-slot="description"></p>
          <footer>
            <div class="card-actions" data-slot="actions"></div>
            <div class="chips" data-slot="chips"></div>
          </footer>
        </div>
        <div data-slot="status-mount"></div>
      </article>
    </template>
    {{PLAN_DRAWER}}
    {{REPOSITORY_SOURCES}}

    <script src="/portal/shared/icon.js" type="module"></script>
    <script src="/portal/shared/notice.js" type="module"></script>
    <script src="/portal/shared/close-button.js" type="module"></script>
    <script src="/portal/shared/copy-button.js" type="module"></script>
    <script src="/portal/shared/menu-button.js" type="module"></script>
    <script src="/portal/plans/elements/index.js" type="module"></script>
    <script src="/portal/shared/theme.js" type="module"></script>
    <script src="/portal/plans/app.js" type="module"></script>
  </body>
</html>
