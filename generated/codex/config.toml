model = "gpt-5.5"
model_reasoning_effort = "medium"
# BEGIN GENERATED AGENT PERMISSIONS
# Source: manifests/inventory/agent-permissions.json
approval_policy = "on-request"
# roborepo credential: Credential denies block reads and writes inside the selected native sandbox.
# roborepo credential: Enforcement requires runtime verification; browser, MCP and escalated processes are unverified.
# roborepo credential: Unbounded deny globs require platform support; Linux and Windows coverage is unverified.
default_permissions = "managed-workspace"

[permissions.managed-workspace]
extends = ":workspace"

[permissions.managed-workspace.workspace_roots]
"~/.worktrees/roborepo" = true

[permissions.managed-workspace.filesystem]
"~/.ssh/**" = "deny"
"~/.aws/**" = "deny"
"~/.gnupg/**" = "deny"
"~/.config/gcloud/**" = "deny"
"~/Library/Keychains/**" = "deny"
"/**/.env" = "deny"
"/**/.env.local" = "deny"
"/**/.env.*.local" = "deny"
"/**/.env.development" = "deny"
"/**/.env.production" = "deny"
"/**/.env.staging" = "deny"
"/**/.env.test" = "deny"
"/**/*.pem" = "deny"
"/**/id_rsa" = "deny"
"/**/id_ed25519" = "deny"

[permissions.managed-workspace.network]
enabled = false
# END GENERATED AGENT PERMISSIONS

# Agent shells run git hooks from ~/.codex/git-hooks: a pre-push check that refuses protected
# branches, then the repo's own hooks.
[shell_environment_policy.set]
GIT_CONFIG_COUNT = "1"
GIT_CONFIG_KEY_0 = "core.hooksPath"
GIT_CONFIG_VALUE_0 = "~/.codex/git-hooks"

[notice.model_migrations]
"gpt-5.2-codex" = "gpt-5.3-codex"
"gpt-5.3-codex" = "gpt-5.4"

[plugins."github@openai-curated"]
enabled = true

[features]
js_repl = true
prevent_idle_sleep = true
hooks = true

[tui.model_availability_nux]
"gpt-5.5" = 4
